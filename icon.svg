<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Green background, rounded like a standard app icon -->
  <rect width="512" height="512" rx="96" fill="#2e7d32"/>

  <!-- RETRO / BALL, big and bold - the whole icon, no separate graphic.
       Chunky/"blocky" look built without an external font file (an SVG
       icon this size has to stay self-contained, and the two static PNGs
       exported from it can't pull in a web font at all) - tight negative
       letter-spacing plus a heavier double text-shadow gives the letterforms
       a solid, stencil-like weight closer to a display block font than the
       plain monospace this replaced. -->
  <text x="256" y="217" font-family="Impact, 'Arial Black', 'Franklin Gothic Bold', sans-serif" font-size="128" font-weight="900"
        fill="#ffffff" text-anchor="middle" letter-spacing="-2"
        style="text-shadow:4px 4px 0 rgba(0,0,0,0.45), 2px 2px 0 rgba(0,0,0,0.25)">RETRO</text>
  <text x="256" y="357" font-family="Impact, 'Arial Black', 'Franklin Gothic Bold', sans-serif" font-size="128" font-weight="900"
        fill="#ffffff" text-anchor="middle" letter-spacing="-2"
        style="text-shadow:4px 4px 0 rgba(0,0,0,0.45), 2px 2px 0 rgba(0,0,0,0.25)">BALL</text>

  <rect width="512" height="512" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8"/>
</svg>
